<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>pagina web</title>

	<style>
		
		nav {
			border: 2px solid darkgreen;
			background: seagreen;
			padding: 20px;
			word-spacing: 260px;
		}	

		nav a {
			color: darkseagreen;
		}

	
		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 20px;
		}

		th, td {
			border: 1px solid black;
			padding: 10px;
			text-align: left;
		}

		th {
			background-color: seagreen;
			color: white;
		}

		/* Controla el tamaño de las imágenes dentro de las celdas */
		td img {
			width: 150px;
			display: block;
			margin: auto;
		}

	</style>
</head>
<body>

<center><nav>
	<a href="#primera_seccion">primera</a>
	<a href="#segunda_seccion">segunda</a>
	<a href="#tercera_seccion">tercera</a>
</nav></center>

<section>
	<h1 id="primera_seccion">LA SECCION NUMERO 1</h1>

	<table>
		<tr>
			<th>Nombre</th>
			<th>Edad</th>
			<th>Ciudad</th>
		</tr>
		<tr>
			<td>Ana</td>
			<td>25</td>
			<td>Madrid</td>
		</tr>
		<tr>
			<td>Carlos</td>
			<td>30</td>
			<td>Bogotá</td>
		</tr>
	</table>
</section>

<hr>

<!-- SECCIÓN 2: TABLA DE 3 FILAS (LARGO) X 2 COLUMNAS (ANCHO) -->

			<td><img src="imagenes/foto1.jpg" alt="Imagen 1"></td>
			<td><img src="imagenes/foto2.jpg" alt="Imagen 2"></td>
		</tr>
		<!-- Fila 2 -->
		<tr>
			<td><img src="imagenes/foto3.jpg" alt="Imagen 3"></td>
			<td><img src="imagenes/foto4.jpg" alt="Imagen 4"></td>
		</tr>
		<!-- Fila 3 -->
		<tr>
			<td><img src="imagenes/foto5.jpg" alt="Imagen 5"></td>
			<td><img src="imagenes/foto6.jpg" alt="Imagen 6"></td>
		</tr>
	</table>
</section>

</body>
</html>
